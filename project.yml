name: AutoClickerPro
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "12.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH: false

targets:
  AutoClickerPro:
    type: application
    platform: macOS
    sources:
      - path: AutoClickerPro
        excludes:
          - "*.entitlements"
          - "Info.plist"
    info:
      path: AutoClickerPro/Info.plist
    entitlements:
      path: AutoClickerPro/AutoClickerPro.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.AutoClickerPro
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        INFOPLIST_FILE: AutoClickerPro/Info.plist
        CODE_SIGN_ENTITLEMENTS: AutoClickerPro/AutoClickerPro.entitlements
        ENABLE_APP_SANDBOX: false
        ENABLE_HARDENED_RUNTIME: false
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: true

  AutoClickerProTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AutoClickerProTests
    dependencies:
      - target: AutoClickerPro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.AutoClickerProTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
